<!DOCTYPE html>
<html lang="pt-br">

<head>

<body>

            <img src="/img/Titulo_kalium.png" alt="Kalium">
            <div class="brand-text">
                <span class="title">Kalium</span>
                <span class="subtitle">Estudos sobre potássio.</span>
            </div>
        </div>

        <button
            class="menu-toggle"
            aria-label="Abrir menu"
            aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links">
            <a href="index.html" class="nav-item">Início</a>
            <a href="conteudo.html" class="nav-item active">Conteúdos</a>
            <a href="ciclo.html" class="nav-item">Ciclo</a>
            <a href="sobre.html" class="nav-item">Sobre</a>
        </nav>

        <div class="actions">
            <button class="icon-btn" aria-label="Buscar">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    width="20"
                    height="20">
                    <circle
                        cx="11"
                        cy="11"
                        r="8">
                    </circle>
                    <line
                        x1="21"
                        y1="21"
                        x2="16.65"
                        y2="16.65">
                    </line>
                </svg>
            </button>
        </div>
    </header>

    <div class="nav-overlay"></div>

    <main class="conteudo-principal">

        <div class="hero-content">

            <h1>Conteúdos sobre Potássio</h1>
            <p>
                Descubra informações detalhadas sobre o potássio
                e seu papel na agricultura e no meio ambiente.
            </p>
        </div>

        <div class="botoes-conteudo">

            <button
                class="btn-glass"
                data-conteudo="corpo">
                Importância do Potássio
            </button>

            <button
                class="btn-glass"
                data-conteudo="corpo">
                Funções no Corpo Humano
            </button>
        </div>
    </main>

    <div
        class="conteudo-overlay"
        id="conteudoOverlay">
        <div class="conteudo-modal">
            <button
                class="conteudo-fechar"
                id="conteudoFechar"
                aria-label="Fechar">
                ×
            </button>

            
            <div class="conteudo-modal-header">
                <h2 id="conteudoTitulo"></h2>
            </div>
            <div
                class="conteudo-modal-body"
                id="conteudoTexto">

        </div>

    </footer>
